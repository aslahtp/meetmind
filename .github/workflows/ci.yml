name: CI

# Lint, tests, build (including a macOS app build + smoke test), secret scan and dependency
# audit. Runs on every PR and push to main, and is called by the release workflow (release.yml)
# as a gate before the installers are built.
#
# Public repo: fork PRs run this with a read-only token and no secrets (`pull_request`, never
# `pull_request_target`), so untrusted PR code can't write to the repo. Keep it that way.
# Actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps them current.
#
# A new commit on a PR cancels the PR's run still in progress (concurrency below). A push to main
# with the same files as a PR commit that already passed skips the jobs (see already-tested).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:
    inputs:
      # Callers (release.yml) always get a full run; already-tested never skips for them.
      always-run:
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: 8.30.1
  # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the release's checksums.txt.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # A push to main that a PR just merged has usually been tested already: the PR's CI ran the
  # same workflow on the same files. If the merged commit's file tree is identical to the PR's
  # final commit and CI passed on that commit, the jobs below are skipped; any difference (the
  # PR was behind main, the PR can't be found, an API error) runs everything. Release runs
  # (workflow_call from release.yml), PRs and manual runs never skip. The dependency audit always
  # runs, since new advisories appear without any file changing.
  #
  # Trust: this reuses a result the merge already relied on (required checks on the PR). A fork
  # PR can't fake it without changing ci.yml itself, which then lands on main with the identical
  # tree it was tested with, after maintainer review (CODEOWNERS covers workflows). The job runs
  # no repository code and only reads through the API.
  #
  # A called workflow can't ask for more than its caller grants, or the caller fails to start:
  # release.yml's `checks` job must keep granting the read scopes below.
  already-tested:
    name: Reuse PR result
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the merged and PR commits' trees
      actions: read # find the PR's CI runs
      pull-requests: read # find the PR a commit came from
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Look for a passing PR run on identical files
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          ALWAYS_RUN: ${{ inputs.always-run }}
        run: |
          # Anything but the skip=true written at the very end runs every job.
          note() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          # Only this workflow's own push to main. release.yml calls it with the same event and
          # ref, so two independent checks keep releases on a full run: the always-run input
          # (true for every workflow_call) and the workflow ref (the caller's file when called).
          if [ "$ALWAYS_RUN" = "true" ]; then
            note "Called by another workflow (release); running full CI."
            exit 0
          fi
          if [ "$EVENT" != "push" ] || [ "$REF" != "refs/heads/main" ] \
            || [[ "$WORKFLOW_REF" != "$REPO/.github/workflows/ci.yml@"* ]]; then
            exit 0
          fi

          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].number // empty' || true)
          if ! [[ "$pr" =~ ^[0-9]+$ ]]; then
            note "No merged PR found for $SHA; running full CI."
            exit 0
          fi

          head=$(gh api "repos/$REPO/pulls/$pr" --jq '.head.sha' || true)
          main_tree=$(gh api "repos/$REPO/git/commits/$SHA" --jq '.tree.sha' || true)
          head_tree=$(gh api "repos/$REPO/git/commits/$head" --jq '.tree.sha' || true)
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ && "$main_tree" =~ ^[0-9a-f]{40}$ ]] || [ "$main_tree" != "$head_tree" ]; then
            note "Merged files differ from PR #$pr's last commit (it was behind main, or the lookup failed); running full CI."
            exit 0
          fi

          run=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$head&status=success&per_page=1" \
            --jq '.workflow_runs[0].html_url // empty' || true)
          if [ -z "$run" ]; then
            note "No successful CI run on PR #$pr's last commit; running full CI."
            exit 0
          fi

          note "Skipping CI: main has the same files as PR #$pr's last commit, which passed in $run"
          echo "skip=true" >> "$GITHUB_OUTPUT"

  lint-test-build:
    name: Lint, test & build
    needs: already-tested
    if: needs.already-tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build renderer
        run: pnpm run build:renderer

      - name: Build extension
        run: pnpm run build:ext

  # Whether a PR touches anything that can change the packaged apps. Docs-only PRs skip the
  # Windows and macOS builds below (a skipped job still satisfies a required status check).
  # Pushes and release runs (workflow_call) always build, unless already-tested skips this job,
  # which skips the two builds with it.
  changes:
    name: Detect changes
    needs: already-tested
    if: needs.already-tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same docs/metadata list as pr-checks.yml's version check, plus the website. Workflow
          # and action changes (.github/) always build: they're what the builds run.
          app=$(git diff --name-only "$BASE_SHA"...HEAD \
            | grep -vE '^(docs/|\.claude/|site/)|\.md$|^(LICENSE|CITATION\.cff|llms\.txt)$|^\.github/(ISSUE_TEMPLATE/|CODEOWNERS$|release_template\.md$)' || true)
          if [ -n "$app" ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "Only docs changed; skipping the app builds." >> "$GITHUB_STEP_SUMMARY"
          fi

  # The Windows release is built only by release.yml, so every PR also packages the unpacked
  # Windows app (the same electron-builder config, FFmpeg pin and koffi binaries the installer
  # ships) and runs its headless self-test, to catch packaging breaks before a release does.
  windows-build:
    name: Windows build & smoke test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      # Also catches Windows-only failures in the pure-logic tests (paths, line endings).
      - name: Test
        shell: bash
        run: pnpm run test

      - name: Fetch FFmpeg (checksum-verified)
        shell: bash
        run: node scripts/fetch-ffmpeg.js --platform win32

      # bash: under the default pwsh the runner's pnpm shim exits 0 without running the script.
      - name: Build unpacked app
        shell: bash
        run: pnpm run build:dir

      - name: Smoke test
        shell: bash
        timeout-minutes: 3
        run: |
          dist/desktop/win-unpacked/MeetMind.exe --smoke > smoke.txt || true
          node scripts/check-smoke.js smoke.txt "Windows x64"

  # macOS has no maintainer hardware, so every PR builds the unsigned Apple Silicon app, checks
  # it, and runs its headless self-test (electron/smoke.js): config + DB, the bundled FFmpeg,
  # WebM→WAV, koffi and the permissions API. The zipped .app is kept for testers.
  mac-build:
    name: macOS build & smoke test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

      - name: Test
        run: pnpm run test

      - name: Fetch FFmpeg (checksum-verified)
        run: node scripts/fetch-ffmpeg.js --platform darwin --arch arm64

      # electron-builder skips all macOS signing on pull-request builds (it checks GITHUB_BASE_REF)
      # unless CSC_FOR_PULL_REQUEST is set, leaving Electron's original signature on a modified
      # bundle, which `codesign --verify` rejects. Its concern is signing secrets reaching fork
      # PRs; the ad-hoc signing used here (`identity: "-"`) needs no certificate, and this job
      # has no secrets.
      - name: Build unpacked app
        run: pnpm run build:mac:dir
        env:
          CSC_FOR_PULL_REQUEST: 'true'

      - name: Check signature and Info.plist
        run: |
          app=dist/desktop/mac-arm64/MeetMind.app
          codesign --verify --deep --strict --verbose=2 "$app"
          plist="$app/Contents/Info.plist"
          for key in NSMicrophoneUsageDescription NSAudioCaptureUsageDescription LSMinimumSystemVersion; do
            echo "$key: $(plutil -extract "$key" raw "$plist")"
          done
          test -x "$app/Contents/Resources/ffmpeg/ffmpeg"
          test -x "$app/Contents/Resources/ffmpeg/ffprobe"

      - name: Smoke test
        timeout-minutes: 3
        run: |
          dist/desktop/mac-arm64/MeetMind.app/Contents/MacOS/MeetMind --smoke > smoke.txt || true
          node scripts/check-smoke.js smoke.txt "macOS arm64"

      # ditto keeps the bundle's symlinks and permissions; fastest compression level, since this is
      # a 7-day test artifact, not a release download.
      - name: Zip app for testers
        run: ditto -c -k --zlibCompressionLevel 1 --keepParent dist/desktop/mac-arm64/MeetMind.app MeetMind-mac-arm64.zip

      # Already a zip: compressing it again only costs time.
      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MeetMind-mac-arm64
          path: MeetMind-mac-arm64.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  repo-hygiene:
    name: Repo hygiene
    needs: already-tested
    if: needs.already-tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for files that must not be committed
        run: |
          status=0
          # pnpm only: npm/yarn lockfiles mean someone ran the wrong package manager.
          if git ls-files --error-unmatch package-lock.json yarn.lock >/dev/null 2>&1; then
            echo "::error::package-lock.json or yarn.lock is committed; this repo uses pnpm."
            status=1
          fi
          # FFmpeg and other binaries are downloaded at build time, never committed. macOS
          # binaries have no extension, so anything in assets/ffmpeg/ but its README counts too.
          binaries=$( { git ls-files '*.exe' '*.dll' '*.msi' '*.dylib'; git ls-files 'assets/ffmpeg/' | grep -v '^assets/ffmpeg/README\.md$'; } || true)
          if [ -n "$binaries" ]; then
            echo "::error::Binaries are committed:"; echo "$binaries"
            status=1
          fi
          # Real env files hold API keys; only .env.example belongs in git.
          envs=$(git ls-files '.env' '.env.*' '**/.env' '**/.env.*' | grep -v '\.env\.example$' || true)
          if [ -n "$envs" ]; then
            echo "::error::Env files are committed:"; echo "$envs"
            status=1
          fi
          # GitHub rejects files over 100 MB; warn well before that.
          large=$(git ls-files -z | xargs -0 -r du -k 2>/dev/null | awk '$1 > 10240 {print $2 " (" int($1/1024) " MB)"}')
          if [ -n "$large" ]; then
            echo "::error::Files over 10 MB are committed:"; echo "$large"
            status=1
          fi
          exit $status

  secret-scan:
    name: Secret scan
    needs: already-tested
    if: needs.already-tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (checksum-verified)
        run: |
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks

      - name: Scan full git history for API keys and tokens
        run: |
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose --exit-code 1

  # Not gated on already-tested: new advisories appear without any file changing.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          install: 'false'

      # Runtime dependencies only (what ships in the installer); fails on high or critical.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # Static security lint of the workflows themselves: catches template injection,
  # dangerous triggers, over-broad permissions and unpinned actions, e.g. in a contributor's PR.
  workflow-security:
    name: Workflow security (zizmor)
    needs: already-tested
    if: needs.already-tested.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          # Fail the job with annotations instead of uploading SARIF (needs no write permission).
          advanced-security: false
