name: Release CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check Package Version
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.version_check.outputs.release_needed }}
      version: ${{ steps.version_check.outputs.version }}
      tag: ${{ steps.version_check.outputs.tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Version & Check Existing Tags
        id: version_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          git fetch --tags
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on remote. Skipping release build."
            echo "release_needed=false" >> $GITHUB_OUTPUT
          else
            echo "Tag ${TAG} does not exist. Creating new release for v${VERSION}."
            echo "release_needed=true" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    name: Build & Publish Release
    needs: check-version
    if: needs.check-version.outputs.release_needed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Desktop App and Extension
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Notes from Template and CHANGELOG
        shell: powershell
        run: |
          $ver = "${{ needs.check-version.outputs.version }}"
          $content = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)##\s+v?$ver\s*\r?\n(.*?)(?=\r?\n##\s+|$)"
          $changelogBody = ""
          if ($content -match $pattern) {
            $changelogBody = $matches[1].Trim()
          } else {
            $changelogBody = "- Release updates for v$ver"
          }

          if (Test-Path .github/release_template.md) {
            $template = Get-Content .github/release_template.md -Raw
            $body = $template.Replace("{VERSION}", $ver).Replace("x.y.z", $ver).Replace("{CHANGELOG_BODY}", $changelogBody)
            $body | Out-File -FilePath release_notes.md -Encoding utf8
          } else {
            $changelogBody | Out-File -FilePath release_notes.md -Encoding utf8
          }


      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: MeetMind ${{ needs.check-version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            dist/desktop/*.exe
            dist/desktop/*.blockmap
            dist/meetmind-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

