name: Build

# Builds and publishes a release when package.json's version has no tag yet.
#
# Supply-chain hardening (public repo): actions are pinned to commit SHAs; the build job runs
# all dependency code with a read-only token and no dependency cache; only the small publish
# job, which runs no dependency code or third-party actions, gets `contents: write`. FFmpeg (shipped inside the
# Windows installer, the macOS apps and the Linux packages) comes from the SHA-256 pins in electron/audio/ffmpeg-sources.ts.
# Every downloadable file gets a signed build-provenance attestation (`gh attestation verify`),
# made by a separate job that runs no project code, from checksums the build jobs report; publish
# checks every file against them. The builds start alongside the CI gate (`checks`), but nothing is
# signed or published until it passes. Once the release is published, the website
# (pages.yml) is rebuilt so its download links point at the new version.

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-version:
    name: Check Package Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_needed: ${{ steps.version_check.outputs.release_needed }}
      version: ${{ steps.version_check.outputs.version }}
      tag: ${{ steps.version_check.outputs.tag }}
      prev_tag: ${{ steps.version_check.outputs.prev_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read Version & Check Existing Tags
        id: version_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          git fetch --tags
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || echo "")
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "Previous release tag on GitHub: ${PREV_TAG}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on remote. Skipping release build."
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${TAG} does not exist. Creating new release for v${VERSION}."
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify changelog parsing for release notes
        run: node scripts/generate-release-notes.js
        env:
          PREV_TAG: ${{ steps.version_check.outputs.prev_tag }}

  # Lint, tests, build, secret scan and dependency audit (ci.yml) must pass before anything is built.
  checks:
    name: Checks
    needs: check-version
    if: needs.check-version.outputs.release_needed == 'true' || github.event_name == 'workflow_dispatch'
    # ci.yml's already-tested job reads PRs and workflow runs; a called workflow can't ask for
    # more than this, or this whole workflow fails to start. It never skips for this caller.
    permissions:
      contents: read
      actions: read # ci.yml: list workflow runs (already-tested)
      pull-requests: read # ci.yml: find a commit's PR (already-tested)
    uses: $/.github/workflows/ci.yml
    with:
      always-run: true

  build:
    name: Build Windows app
    # Starts alongside `checks` rather than after it: builds hold a read-only token and no secrets,
    # and nothing is signed or published until `checks` passes (attest and publish need it).
    needs: check-version
    if: needs.check-version.outputs.release_needed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      checksums: ${{ steps.checksums.outputs.checksums }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: the installer is built from a clean, lockfile-verified install.
      - name: Setup
        uses: $/.github/actions/setup
        with:
          cache: 'false'

      - name: Download FFmpeg Binaries (checksum-verified)
        shell: bash
        run: pnpm exec tsx scripts/fetch-ffmpeg.ts --platform win32

      # `pnpm run build` passes --publish never: electron-builder only builds, it never needs a token.
      # bash, like the setup action's install: under the default pwsh the runner's pnpm shim exited 0
      # without running the script. The ls fails the step here if the build produced nothing.
      - name: Build Desktop App and Extension
        shell: bash
        run: |
          pnpm run build
          ls -l dist/desktop/*.exe dist/meetmind-extension.zip

      # Headless self-test of the packaged app (electron/smoke.ts): bundled FFmpeg, koffi, DB.
      - name: Smoke test
        shell: bash
        timeout-minutes: 3
        run: |
          dist/desktop/win-unpacked/MeetMind.exe --smoke > smoke.txt || true
          pnpm exec tsx scripts/check-smoke.ts smoke.txt "Windows x64 (release)"

      # SHA-256 of each file users download, for the attest job to sign without downloading them.
      - name: Checksums
        id: checksums
        shell: bash
        run: |
          {
            echo 'checksums<<CHECKSUMS_EOF'
            (cd dist/desktop && sha256sum --binary *.exe | sed 's/ \*/  /')
            (cd dist && sha256sum --binary meetmind-extension.zip | sed 's/ \*/  /')
            echo 'CHECKSUMS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          if-no-files-found: error
          retention-days: 7
          # The installer and extension are already compressed; the rest is a few KB.
          compression-level: 0
          path: |
            dist/desktop/*.exe
            dist/desktop/*.blockmap
            dist/desktop/latest.yml
            dist/meetmind-extension.zip

  # macOS DMGs (Apple Silicon + Intel), ad-hoc signed: there is no Apple Developer ID yet. Both
  # arches build in one electron-builder run so a single latest-mac.yml lists both. FFmpeg comes
  # from the per-arch pins in electron/audio/ffmpeg-sources.ts, each checked against its SHA-256.
  # When signing is added: give this job a protected environment holding CSC_LINK,
  # CSC_KEY_PASSWORD and the APPLE_API_KEY* notarization secrets, and update electron-builder.yml.
  build-mac:
    name: Build macOS app
    needs: check-version # alongside `checks`, as `build` explains
    if: needs.check-version.outputs.release_needed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      checksums: ${{ steps.checksums.outputs.checksums }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: the app is built from a clean, lockfile-verified install.
      - name: Setup
        uses: $/.github/actions/setup
        with:
          cache: 'false'

      - name: Download FFmpeg Binaries (checksum-verified)
        run: pnpm exec tsx scripts/fetch-ffmpeg.ts --platform darwin --arch arm64 --arch x64

      # `build:mac` passes --publish never, like `build`.
      - name: Build macOS App
        run: |
          pnpm run build:mac
          ls -l dist/desktop/*.dmg dist/desktop/*-mac.zip dist/desktop/latest-mac.yml

      # Both apps signed and carrying FFmpeg, and one latest-mac.yml listing both update zips
      # (electron-updater picks the right one by arch; a missing entry strands that arch).
      - name: Verify apps
        run: |
          for app in dist/desktop/mac-arm64/MeetMind.app dist/desktop/mac/MeetMind.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            test -x "$app/Contents/Resources/ffmpeg/ffmpeg"
          done
          for arch in arm64 x64; do
            grep -q -- "-$arch-mac.zip" dist/desktop/latest-mac.yml || { echo "::error::latest-mac.yml has no $arch update zip"; exit 1; }
          done

      - name: Smoke test
        timeout-minutes: 3
        run: |
          dist/desktop/mac-arm64/MeetMind.app/Contents/MacOS/MeetMind --smoke > smoke.txt || true
          pnpm exec tsx scripts/check-smoke.ts smoke.txt "macOS arm64 (release)"

      # SHA-256 of each file users download, for the attest job to sign without downloading them.
      - name: Checksums
        id: checksums
        run: |
          {
            echo 'checksums<<CHECKSUMS_EOF'
            (cd dist/desktop && shasum -a 256 *.dmg *-mac.zip | sed 's/ \*/  /')
            echo 'CHECKSUMS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-mac
          if-no-files-found: error
          retention-days: 7
          # DMGs and zips are already compressed; recompressing ~800 MB only costs time.
          compression-level: 0
          path: |
            dist/desktop/*.dmg
            dist/desktop/*-mac.zip
            dist/desktop/*.blockmap
            dist/desktop/latest-mac.yml

  # Linux AppImage (updates itself through latest-linux.yml) and .deb, x64. Same rules as the other
  # builds: read-only token, no dependency cache, FFmpeg from its SHA-256 pin. Nothing to sign.
  build-linux:
    name: Build Linux app
    needs: check-version # alongside `checks`, as `build` explains
    if: needs.check-version.outputs.release_needed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      checksums: ${{ steps.checksums.outputs.checksums }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: the app is built from a clean, lockfile-verified install.
      - name: Setup
        uses: $/.github/actions/setup
        with:
          cache: 'false'

      - name: Download FFmpeg Binaries (checksum-verified)
        run: pnpm exec tsx scripts/fetch-ffmpeg.ts --platform linux

      # `build:linux` passes --publish never, like `build`.
      - name: Build Linux App
        run: |
          pnpm run build:linux
          ls -l dist/desktop/*.AppImage dist/desktop/*.deb dist/desktop/latest-linux.yml

      # The AppImage must be listed in latest-linux.yml, or AppImage installs never see the update.
      - name: Verify packages
        run: |
          test -x dist/desktop/linux-unpacked/resources/ffmpeg/ffmpeg
          grep -q -- '-x86_64.AppImage' dist/desktop/latest-linux.yml || { echo "::error::latest-linux.yml has no AppImage"; exit 1; }
          dpkg-deb --field dist/desktop/*.deb Package Version

      # See ci.yml's linux-build job for why each of these is needed.
      - name: Prepare display and audio
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=smoke
          pactl set-default-sink smoke

      - name: Smoke test
        timeout-minutes: 3
        run: |
          xvfb-run -a dist/desktop/linux-unpacked/meetmind --smoke > smoke.txt || true
          pnpm exec tsx scripts/check-smoke.ts smoke.txt "Linux x64 (release)"

      # SHA-256 of each file users download, for the attest job to sign without downloading them.
      - name: Checksums
        id: checksums
        run: |
          {
            echo 'checksums<<CHECKSUMS_EOF'
            (cd dist/desktop && sha256sum *.AppImage *.deb | sed 's/ \*/  /')
            echo 'CHECKSUMS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-linux
          if-no-files-found: error
          retention-days: 7
          # The AppImage and .deb are already compressed.
          compression-level: 0
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.deb
            dist/desktop/latest-linux.yml

  # Signed SLSA build provenance for every file users download, so anyone can check that a file
  # came from this workflow and commit: gh attestation verify <file> --repo aslahtp/meetmind.
  # Its own job: the OIDC token that signs attestations is never available to the build jobs,
  # which run dependency code. It signs the SHA-256 checksums the build jobs computed from the
  # files they uploaded, so it downloads nothing; publish checks every file against them before
  # releasing. It waits for `checks`, so nothing is signed until CI has passed.
  attest:
    name: Attest build provenance
    needs: [checks, build, build-mac, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Sigstore signing certificate for the attestation
      attestations: write # store the attestations in this repository
    steps:
      # 8 files: the installer, the extension, 2 DMGs, 2 mac update zips, the AppImage and the .deb.
      - name: Collect checksums
        env:
          WINDOWS: ${{ needs.build.outputs.checksums }}
          MAC: ${{ needs.build-mac.outputs.checksums }}
          LINUX: ${{ needs.build-linux.outputs.checksums }}
        run: |
          printf '%s\n' "$WINDOWS" "$MAC" "$LINUX" | sed '/^$/d' > checksums.txt
          cat checksums.txt
          if grep -vqE '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' checksums.txt; then
            echo "::error::Malformed checksum line"; exit 1
          fi
          test "$(wc -l < checksums.txt)" -eq 8 || { echo "::error::Expected 8 checksums"; exit 1; }

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: checksums.txt

  publish:
    name: Publish Release
    needs: [check-version, checks, build, build-mac, build-linux, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job with write access; it runs no project dependencies.
    permissions:
      contents: write # create the tag and release, upload the installer
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      # Uploaded from dist/desktop/ only, so these land at the folder root.
      - name: Download macOS release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files-mac
          path: release-files-mac

      # Also uploaded from dist/desktop/ only.
      - name: Download Linux release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files-linux
          path: release-files-linux

      # Every file users download must be exactly what the attest job signed, and nothing unsigned
      # may ride along.
      - name: Check files against the attested checksums
        env:
          WINDOWS: ${{ needs.build.outputs.checksums }}
          MAC: ${{ needs.build-mac.outputs.checksums }}
          LINUX: ${{ needs.build-linux.outputs.checksums }}
        run: |
          printf '%s\n' "$WINDOWS" "$MAC" "$LINUX" | sed '/^$/d' > checksums.txt
          if grep -vqE '^[0-9a-f]{64}  [A-Za-z0-9._-]+$' checksums.txt; then
            echo "::error::Malformed checksum line"; exit 1
          fi
          mapfile -t files < <(find release-files release-files-mac release-files-linux -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*-mac.zip' -o -name '*.AppImage' -o -name '*.deb' \
               -o -name 'meetmind-extension.zip' \))
          test "${#files[@]}" -eq "$(wc -l < checksums.txt)" ||
            { echo "::error::${#files[@]} release files but $(wc -l < checksums.txt) attested checksums"; exit 1; }
          for file in "${files[@]}"; do
            expected=$(awk -v n="$(basename "$file")" '$2 == n { print $1 }' checksums.txt)
            test -n "$expected" || { echo "::error::$file was not attested"; exit 1; }
            echo "$expected  $file" | sha256sum --check --strict -
          done

      - name: Generate Release Notes from Template and CHANGELOG
        run: node scripts/generate-release-notes.js
        env:
          PREV_TAG: ${{ needs.check-version.outputs.prev_tag }}

      # The runner's own `gh` CLI, so no third-party action ever holds the write token.
      # Tags the exact commit that was built, not whatever main points to by now.
      - name: Create GitHub Release and Upload Artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check-version.outputs.tag }}
        run: |
          shopt -s failglob
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MeetMind $TAG" \
            --notes-file release_notes.md \
            release-files/desktop/*.exe \
            release-files/desktop/*.blockmap \
            release-files/desktop/latest.yml \
            release-files-mac/*.dmg \
            release-files-mac/*-mac.zip \
            release-files-mac/*.blockmap \
            release-files-mac/latest-mac.yml \
            release-files-linux/*.AppImage \
            release-files-linux/*.deb \
            release-files-linux/latest-linux.yml \
            release-files/meetmind-extension.zip

  # Rebuild the website now that this version's installers exist; pages.yml skips version bumps.
  # A called workflow can't ask for more than this, or this whole workflow fails to start.
  site:
    name: Website
    needs: publish
    permissions:
      contents: read
      pages: write # pages.yml deploy: publish to GitHub Pages
      id-token: write # pages.yml deploy: OIDC token deploy-pages uses to prove the deployment's origin
    uses: $/.github/workflows/pages.yml
