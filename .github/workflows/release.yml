name: Build

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check Package Version
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.version_check.outputs.release_needed }}
      version: ${{ steps.version_check.outputs.version }}
      tag: ${{ steps.version_check.outputs.tag }}
      prev_tag: ${{ steps.version_check.outputs.prev_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Version & Check Existing Tags
        id: version_check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          git fetch --tags
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || echo "")
          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT
          echo "Previous release tag on GitHub: ${PREV_TAG}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on remote. Skipping release build."
            echo "release_needed=false" >> $GITHUB_OUTPUT
          else
            echo "Tag ${TAG} does not exist. Creating new release for v${VERSION}."
            echo "release_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Verify changelog parsing for release notes
        run: node scripts/generate-release-notes.js
        env:
          PREV_TAG: ${{ steps.version_check.outputs.prev_tag }}

  build-and-release:
    name: Build & Publish Release
    needs: check-version
    if: needs.check-version.outputs.release_needed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Download FFmpeg Binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path assets/ffmpeg | Out-Null

          $zipPath = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $zipPath -UserAgent "MeetMind-CI/1.0"

          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-extracted"
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractDir -Force

          $ffmpegExe = Get-ChildItem -Path $extractDir -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path $extractDir -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpegExe -or -not $ffprobeExe) {
            throw "Could not locate ffmpeg.exe/ffprobe.exe in the downloaded archive."
          }

          Copy-Item $ffmpegExe.FullName -Destination "assets/ffmpeg/ffmpeg.exe" -Force
          Copy-Item $ffprobeExe.FullName -Destination "assets/ffmpeg/ffprobe.exe" -Force
          Write-Host "FFmpeg binaries staged in assets/ffmpeg/ for packaging."

      - name: Build Desktop App and Extension
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Release Notes from Template and CHANGELOG
        run: node scripts/generate-release-notes.js
        env:
          PREV_TAG: ${{ needs.check-version.outputs.prev_tag }}



      - name: Create GitHub Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.tag }}
          name: MeetMind ${{ needs.check-version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            dist/desktop/*.exe
            dist/desktop/*.blockmap
            dist/desktop/latest.yml
            dist/meetmind-extension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

