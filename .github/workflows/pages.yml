name: Website

# A version bump (package.json) doesn't trigger this: release.yml calls it once that version's
# release is published, so the site never links installers that don't exist yet.
on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/brand/**'
      - 'docs/screenshots/**'
      - 'llms.txt'
      - 'scripts/build-site.sh'
      - 'scripts/build-site-images.ts'
      - '.github/workflows/pages.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the sitemap's lastmod is the last commit that changed the page.
          fetch-depth: 0
          persist-credentials: false

      # sharp makes the AVIF screenshots (scripts/build-site-images.ts). No dependency cache: what
      # this job builds is published, as with release builds.
      - name: Setup pnpm and Node
        uses: $/.github/actions/setup
        with:
          cache: 'false'

      # The site links the newest published release, not package.json's version, which reaches
      # main before release.yml has built and published it.
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt \
            --jq '"version=\(.tagName | ltrimstr("v"))\ndate=\(.publishedAt[:10])"' >> "$GITHUB_OUTPUT"

      - name: Assemble site
        env:
          SITE_VERSION: ${{ steps.release.outputs.version }}
          SITE_RELEASE_DATE: ${{ steps.release.outputs.date }}
        run: bash scripts/build-site.sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploy rights only here; the build job runs the site script with read-only access.
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # OIDC token deploy-pages uses to prove the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
