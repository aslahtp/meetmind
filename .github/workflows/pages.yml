name: Website

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'docs/brand/**'
      - 'docs/screenshots/**'
      - 'llms.txt'
      - 'package.json'
      - 'scripts/build-site.sh'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assemble site
        run: bash scripts/build-site.sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Deploy rights only here; the build job runs the site script with read-only access.
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # OIDC token deploy-pages uses to prove the deployment's origin
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
