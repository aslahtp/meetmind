name: CodeQL

# Static security analysis of the JavaScript (main process, renderer, extension) and of the
# GitHub Actions workflows.
# Results appear under Security → Code scanning. If the repo's CodeQL "default setup" is
# enabled, turn it off (Settings → Code security) or this advanced workflow's uploads fail.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    # Check names stay "Analyze JavaScript" / "Analyze Actions" (branch protection may require them).
    name: Analyze ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: JavaScript
            language: javascript-typescript
          # The workflows themselves (injection, untrusted checkouts, over-broad permissions),
          # complementing zizmor in ci.yml.
          - name: Actions
            language: actions
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - dist
              - node_modules
              - tests

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
