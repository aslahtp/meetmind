version: 2

updates:
  # Keep workflow actions current (security fixes land in new action versions).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # One grouped PR a week for minor/patch updates. Major versions (Electron, React, Vite,
  # Tailwind, ...) need manual migration, so they're left out; security fixes still arrive
  # as separate Dependabot security PRs when "Dependabot security updates" is on.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Only propose versions at least a week old, so a compromised release is caught and pulled
    # first. Longer than pnpm's 1-day minimumReleaseAge (pnpm-workspace.yaml), which stays short
    # so an urgent fix can still be installed by hand.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
