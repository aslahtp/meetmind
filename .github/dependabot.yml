version: 2

updates:
  # Keep workflow actions current (security fixes land in new action versions).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 1
    groups:
      actions:
        patterns: ['*']

  # One grouped PR a week for minor/patch updates. Major versions (Electron, React, Vite,
  # Tailwind, ...) need manual migration, so they're left out; security fixes still arrive
  # as separate Dependabot security PRs when "Dependabot security updates" is on.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Match pnpm's minimumReleaseAge (pnpm-workspace.yaml): skip versions under a day old,
    # so a compromised release is pulled before it's proposed (and pnpm doesn't reject it).
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
