allowBuilds:
  # electron-winstaller (pulled in by electron-builder) only picks a 7-Zip binary for
  # Squirrel.Windows targets; MeetMind builds NSIS, so the script never needs to run.
  electron-winstaller: false
  esbuild: true
  # koffi's install script only builds from source; the prebuilt binary comes from its
  # @koromix/koffi-<platform> optional dependency, so the script never needs to run.
  koffi: false
# Electron 42+ has no install script: it downloads its binary the first time it is launched,
# or explicitly with `pnpm exec install-electron`.
nodeLinker: hoisted
# Also install the other CPU's prebuilt native packages (e.g. @koromix/koffi-darwin-x64 on an
# Apple Silicon runner), so `pnpm run build:mac` can package both arm64 and x64 from one machine.
# electron-builder.yml's per-platform `files` keep each package to its own OS's binaries.
supportedArchitectures:
  os: [current]
  cpu: [current, arm64, x64]
# pnpm would otherwise reinstall before every `pnpm run` whenever package.json changes (even a
# version bump). That reinstall replaces node_modules/electron, which fails while the app is
# running and leaves Electron without its binary. Warn instead; run `pnpm install` yourself.
verifyDepsBeforeRun: warn
# Supply-chain guard: refuse package versions published less than a day ago (value in minutes).
# Most compromised npm releases are caught and unpublished within hours, so a fresh malicious
# version can't be resolved by `pnpm add`/`pnpm update` while it's still live. Dependabot
# picks versions itself, so .github/dependabot.yml has its own (longer, 7-day) `cooldown`.
# To take an urgent fix sooner, add it to `minimumReleaseAgeExclude` and remove it afterwards.
minimumReleaseAge: 1440
