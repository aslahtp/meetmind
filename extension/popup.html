<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 290px;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      background: #0e0e12;
      color: #f5f5fa;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: #15151b;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .title { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; color: #fff; }
    .subtitle { font-size: 11px; color: #10b981; font-weight: 500; }

    .version-badge {
      font-size: 10px;
      font-family: monospace;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      color: #888;
    }

    .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }

    .status-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #191922;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }
    .dot.disconnected {
      background: #f59e0b;
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);
    }
    .dot.recording {
      background: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.8); }
    }

    .status-text { font-size: 12px; font-weight: 500; color: #d0d0dc; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 9px 12px;
      border: none;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      outline: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #10b981 0%, #14b8a6 100%);
      color: #09090b;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.2);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #34d399 0%, #2dd4bf 100%);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: #191922;
      color: #a0a0b0;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-ghost:hover {
      background: #22222f;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .footer {
      padding: 10px 16px;
      background: #111116;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 11px;
      color: #666;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer a { color: #10b981; text-decoration: none; font-weight: 500; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="logo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#09090b" stroke-width="2.5">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>
        </svg>
      </div>
      <div>
        <div class="title">MeetMind</div>
        <div class="subtitle">AI Meeting Companion</div>
      </div>
    </div>
    <span class="version-badge" id="version-badge">v1.7.1</span>
  </div>

  <div class="body">
    <div class="status-card">
      <div class="status-left">
        <div class="dot disconnected" id="status-dot"></div>
        <span class="status-text" id="status-text">Checking desktop app…</span>
      </div>
    </div>

    <button class="btn btn-primary" id="open-app-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      Open Desktop App
    </button>

    <button class="btn btn-ghost" id="go-to-meet-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
      </svg>
      Open Google Meet
    </button>
  </div>

  <div class="footer">
    <span>Detects Meet & Zoom</span>
    <a href="https://github.com/meetmind/meetmind" target="_blank">Docs ↗</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
