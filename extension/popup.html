<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #1a1a1a;
      color: #f0f0f0;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid #2a2a2a;
    }

    .logo {
      width: 24px; height: 24px;
      background: #22c55e;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .title { font-weight: 600; font-size: 14px; }
    .subtitle { font-size: 11px; color: #666; }

    .body { padding: 12px 14px; }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: #212121;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.connected   { background: #22c55e; }
    .dot.disconnected { background: #6b7280; }
    .dot.recording   { background: #ef4444; animation: pulse 1.2s infinite; }

    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:0.4; transform:scale(0.75); }
    }

    .status-text { font-size: 12px; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; padding: 8px;
      border: none; border-radius: 8px;
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: background 0.15s;
    }

    .btn-primary { background: #22c55e; color: #fff; }
    .btn-primary:hover { background: #16a34a; }
    .btn-ghost { background: #212121; color: #888; border: 1px solid #2a2a2a; }
    .btn-ghost:hover { background: #252525; color: #f0f0f0; }

    .footer {
      padding: 8px 14px;
      border-top: 1px solid #2a2a2a;
      font-size: 11px;
      color: #444;
      text-align: center;
    }

    .footer a { color: #22c55e; text-decoration: none; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>
      </svg>
    </div>
    <div>
      <div class="title">MeetMind</div>
      <div class="subtitle">AI Meeting Notes</div>
    </div>
  </div>

  <div class="body">
    <div class="status-row">
      <div class="dot disconnected" id="status-dot"></div>
      <span class="status-text" id="status-text">Checking app status…</span>
    </div>

    <button class="btn btn-primary" id="open-app-btn" style="margin-bottom:8px">
      Open MeetMind
    </button>

    <button class="btn btn-ghost" id="go-to-meet-btn">
      Open Google Meet
    </button>
  </div>

  <div class="footer">
    Detects Meet & Zoom automatically •
    <a href="https://github.com/meetmind/meetmind" target="_blank">Docs</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
