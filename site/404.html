<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · MeetMind</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f8f5ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1813" media="(prefers-color-scheme: dark)">
  <!-- GitHub Pages serves this file for any missing path, so every URL here is absolute. -->
  <link rel="icon" href="/meetmind/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/meetmind/icon-32.png" sizes="32x32" type="image/png">
  <style>
    @font-face {
      font-family: 'DM Sans';
      src: url('/meetmind/fonts/DMSans-Variable.woff2') format('woff2');
      font-weight: 100 1000;
      font-style: normal;
      font-display: swap;
    }

    /* Tokens from DESIGN.md, with the site's derived dark theme. */
    :root {
      --paper: #f8f5ed;
      --ink: #000000;
      --graphite: #707070;
      --sunshine: #ffda6e;
      --sunshine-deep: #f5ca50;
      --hover-wash: color-mix(in srgb, var(--ink) 6%, transparent);
      color-scheme: light;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1a1813;
        --ink: #f8f5ed;
        --graphite: #a8a296;
        color-scheme: dark;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 16px;
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Sans', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-feature-settings: "ss03", "ss04";
      font-size: 18px;
      line-height: 1.5;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 32px;
      border: 1px solid var(--ink);
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.286em;
      overflow: hidden;
    }

    .badge .num {
      display: grid;
      place-items: center;
      height: 100%;
      padding: 0 10px;
      border-right: 1px solid var(--ink);
      letter-spacing: 0;
    }

    .badge .label {
      padding: 0 calc(16px - 0.286em) 0 16px;
    }

    h1 {
      font-size: clamp(34px, 5.2vw + 14px, 64px);
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: -0.016em;
      margin: 32px auto 16px;
      text-wrap: balance;
    }

    p {
      color: var(--graphite);
      max-width: 640px;
      margin: 0 auto;
      text-wrap: pretty;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin-top: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 24px;
      border-radius: 24px;
      border: 1px solid var(--ink);
      font-size: 16px;
      font-weight: 500;
      line-height: 1.25;
      text-decoration: none;
      color: var(--ink);
      transition: background-color .15s ease, border-color .15s ease;
    }

    .btn-primary {
      background: var(--sunshine);
      border-color: var(--sunshine);
      color: #000000;
    }

    .btn-primary:hover {
      background: var(--sunshine-deep);
      border-color: var(--sunshine-deep);
    }

    .btn-ghost:hover {
      background: var(--hover-wash);
    }

    :focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      .actions .btn {
        flex: 1 1 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <span class="badge"><span class="num">404</span><span class="label">Not found</span></span>
    <h1>This page isn't here</h1>
    <p>The link may be out of date. Everything about MeetMind, including downloads, is on the home page.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/meetmind/">Go to the MeetMind home page</a>
      <a class="btn btn-ghost" href="https://github.com/aslahtp/meetmind/releases/latest">Latest release on GitHub</a>
    </div>
  </main>
</body>

</html>
