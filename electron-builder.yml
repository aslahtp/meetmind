appId: com.meetmind.app
productName: MeetMind
copyright: Copyright © 2025 MeetMind

directories:
  output: dist/desktop
  buildResources: assets

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: icons/icon.ico
  signAndEditExecutable: false
  artifactName: "${productName}-Setup-${version}.${ext}"

afterPack: scripts/after-pack.js

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-Setup-${version}.${ext}"
  installerIcon: icons/icon.ico
  uninstallerIcon: icons/icon.ico
  installerHeaderIcon: icons/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MeetMind
  include: installer.nsh
  warningsAsErrors: false

protocols:
  - name: MeetMind
    schemes:
      - meetmind

extraResources:
  - from: assets/ffmpeg/
    to: ffmpeg/
    filter:
      - "**/*"

asar: true

files:
  - dist/renderer/**
  - electron/**
  - assets/icons/**
  - package.json
  - "!assets/ffmpeg/**"

electronVersion: "33.2.1"

publish:
  provider: github
  owner: aslahtp
  repo: meetmind
  releaseType: release
