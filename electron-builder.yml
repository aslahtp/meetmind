appId: com.meetmind.app
productName: MeetMind
copyright: Copyright © 2025 MeetMind

directories:
  output: dist/desktop
  buildResources: assets

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: icons/icon.ico
  signAndEditExecutable: false
  artifactName: "${productName}-Setup-${version}.${ext}"
  # Ship only the Windows x64 koffi binary (see the koffi note under asarUnpack).
  files:
    - "!node_modules/@koromix/koffi-darwin-*/**"
    - "!node_modules/@koromix/koffi-win32-{arm64,ia32}/**"
  # ffmpeg.exe / ffprobe.exe sit at the root of assets/ffmpeg/ (README and mac-* folders stay out).
  extraResources:
    - from: assets/ffmpeg/
      to: ffmpeg/
      filter:
        - "*.exe"

# macOS: separate Apple Silicon and Intel builds (`pnpm run build:mac` builds both in one run so a
# single latest-mac.yml lists both). Ad-hoc signed until there is an Apple Developer ID: set
# `identity` to the Developer ID name, `hardenedRuntime: true` and `notarize: true` then.
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    # The zip is what electron-updater reads from latest-mac.yml.
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.productivity
  icon: icons/icon.png
  minimumSystemVersion: "14.2"
  identity: "-"
  hardenedRuntime: false
  notarize: false
  # Relative to the project root, not `buildResources`: electron-builder hands these paths to
  # codesign as-is.
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  # Applies to the update zip (MeetMind-X.Y.Z-arm64-mac.zip); the DMG name is set under `dmg`.
  # Keep ${arch} in the name: electron-updater picks the arm64/x64 file by it.
  artifactName: "${productName}-${version}-${arch}-mac.${ext}"
  extendInfo:
    NSMicrophoneUsageDescription: MeetMind records your microphone during meetings you choose to record.
    # Without this, macOS 14.2+ hands back a silent system-audio stream with no error.
    NSAudioCaptureUsageDescription: MeetMind records the meeting audio playing on your Mac so other participants are included in your notes.
  # Pinned FFmpeg for this arch, fetched by scripts/fetch-ffmpeg.js.
  extraResources:
    - from: assets/ffmpeg/mac-${arch}/
      to: ffmpeg/
  files:
    - "!node_modules/@koromix/koffi-win32-*/**"

# What users download: MeetMind-X.Y.Z-arm64.dmg (Apple Silicon) / MeetMind-X.Y.Z-x64.dmg (Intel).
dmg:
  artifactName: "${productName}-${version}-${arch}.${ext}"

# Linux (x64): an AppImage, which updates itself through latest-linux.yml, and a .deb, which the
# user updates by installing the new package (the app then only checks and links to it). Built on
# Linux (`pnpm run build:linux`); the .deb needs fpm, which electron-builder downloads.
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  executableName: meetmind
  # The installed .desktop file is named after package.json's desktopName (meetmind.desktop), which
  # matches Electron's Wayland app_id and WM_CLASS, so docks show the right icon.
  syncDesktopName: true
  icon: icons/icon.png
  category: Office
  synopsis: AI meeting notes from your meeting audio
  description: Records your computer's audio and microphone during online meetings, transcribes them and writes meeting notes.
  maintainer: Aslah <87909460+aslahtp@users.noreply.github.com>
  # Keep ${arch} in the name: electron-updater picks the file by it (x86_64 AppImage, amd64 .deb).
  artifactName: "${productName}-${version}-${arch}.${ext}"
  # Pinned FFmpeg (with PulseAudio input), fetched by scripts/fetch-ffmpeg.js.
  extraResources:
    - from: assets/ffmpeg/linux-${arch}/
      to: ffmpeg/
  # Nothing loads koffi on Linux (meeting detection there uses pactl and Electron's window list).
  files:
    - "!node_modules/@koromix/**"

deb:
  # pactl finds the audio devices (system audio, meeting detection). Desktop installs have it.
  recommends:
    - pulseaudio-utils

afterPack: scripts/after-pack.js

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-Setup-${version}.${ext}"
  installerIcon: icons/icon.ico
  uninstallerIcon: icons/icon.ico
  installerHeaderIcon: icons/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MeetMind
  include: installer.nsh
  warningsAsErrors: false

protocols:
  - name: MeetMind
    schemes:
      - meetmind

asar: true
# koffi (meeting detection's FFI, plus the macOS screen-capture permission check) loads a native
# .node file, which can't be loaded from inside the asar archive. Electron redirects these paths
# to app.asar.unpacked.
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**

files:
  - dist/renderer/**
  - electron/**
  - assets/icons/**
  - package.json
  - "!assets/ffmpeg/**"
  # koffi's optional dependencies cover every OS/CPU; only the Windows and macOS builds use koffi,
  # and each platform section above drops the other platforms' binaries.
  - "!node_modules/@koromix/koffi-{android,freebsd,linux,openbsd}-*/**"

# No `electronVersion`: electron-builder packages the Electron the lockfile installed
# (node_modules/electron), so the shipped runtime always matches dev and tests. A pin here
# drifted whenever Dependabot bumped `electron` in package.json.

publish:
  provider: github
  owner: aslahtp
  repo: meetmind
  releaseType: release
