appId: com.meetmind.app
productName: MeetMind
copyright: Copyright © 2025 MeetMind

directories:
  output: dist/desktop
  buildResources: assets

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: icons/icon256.png
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MeetMind

protocols:
  - name: MeetMind
    schemes:
      - meetmind

extraResources:
  - from: assets/ffmpeg/
    to: ffmpeg/
    filter:
      - "**/*"

asar: true

files:
  - dist/renderer/**
  - electron/**
  - package.json
  - "!node_modules/**"
  - "!assets/ffmpeg/**"

electronVersion: "33.2.1"
