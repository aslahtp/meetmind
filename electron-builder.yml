appId: com.meetmind.app
productName: MeetMind
copyright: Copyright © 2025 MeetMind

directories:
  output: dist/desktop
  buildResources: assets

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: icons/icon.ico
  signAndEditExecutable: false
  artifactName: "${productName}-Setup-${version}.${ext}"
  # Ship only the Windows x64 koffi binary (see the koffi note under asarUnpack).
  files:
    - "!node_modules/@koromix/koffi-darwin-*/**"
    - "!node_modules/@koromix/koffi-win32-{arm64,ia32}/**"

afterPack: scripts/after-pack.js

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-Setup-${version}.${ext}"
  installerIcon: icons/icon.ico
  uninstallerIcon: icons/icon.ico
  installerHeaderIcon: icons/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MeetMind
  include: installer.nsh
  warningsAsErrors: false

protocols:
  - name: MeetMind
    schemes:
      - meetmind

extraResources:
  - from: assets/ffmpeg/
    to: ffmpeg/
    filter:
      - "**/*"

asar: true
# koffi (meeting detection's Win32 FFI) loads a native .node file, which can't be loaded from
# inside the asar archive. Electron redirects these paths to app.asar.unpacked.
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**

files:
  - dist/renderer/**
  - electron/**
  - assets/icons/**
  - package.json
  - "!assets/ffmpeg/**"
  # koffi's optional dependencies cover every OS/CPU; only Windows and macOS builds exist, and
  # each platform section below drops the other platform's binaries.
  - "!node_modules/@koromix/koffi-{android,freebsd,linux,openbsd}-*/**"

electronVersion: "44.7.0"

publish:
  provider: github
  owner: aslahtp
  repo: meetmind
  releaseType: release
